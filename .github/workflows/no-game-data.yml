name: No Game Data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: no-game-data-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  no-game-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: No game data tracked
        run: |
          bad=$(git ls-files | grep -iE '\.(rpf|ttpf|xvd|msixvc|dxbc|fssm|spv|spvasm|dds|bk2|awc|r9modeldata|obj|glb|ogg|wav|exe|dll)$' || true)
          if [ -n "$bad" ]; then
            echo "Game or binary files tracked:"
            echo "$bad"
            exit 1
          fi
      - name: No game data under another name
        run: python3 -I scripts/check_no_game_data.py
