name: jactionlint

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:

permissions: {}

concurrency:
  # Coalesce superseded pending pushes per branch without canceling an active main build.
  group: jactionlint-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jactionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `correctness` checks workflow syntax, expressions, shellcheck, and dependabot.yml;
      # switch to `default` once all workflows declare timeouts and concurrency.
      - uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          profile: correctness
